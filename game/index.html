<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marisol Vice — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    display: block;
    touch-action: none;
    background: #1d6f8e;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Marisol Vice: explore Port Marisol on foot and by car, run missions, dodge the police"></canvas>
<p id="status" role="status" aria-live="polite">Marisol Vice is loading.</p>
<script type="module">
  import { Game } from './src/game.js';
  const canvas = document.getElementById('game');
  const game = new Game(canvas);
  document.getElementById('status').textContent = 'Marisol Vice: press Enter to start Danny’s story.';
  void game;
</script>
</body>
</html>
